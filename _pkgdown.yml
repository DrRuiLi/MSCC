url: https://drruili.github.io/MSCC/

template:
  bootstrap: 5
  bootswatch: litera

home:
  title: MSCC
  description: >
    Mass spectrometry chemical calculation — formulas, isotopes, adducts,
    molecular graphs, and CFM-ID helpers for metabolomics.

development:
  mode: auto

# Only vignettes under vignettes/articles/ appear in the Articles menu.
# Root vignettes (MSCC, CFM_shiny, RDKit-dev, …) are built but hidden,
# except get-started which is linked as navbar "Get started" (intro).
articles:
- title: Articles
  navbar: ~
  contents:
  - starts_with("articles")

- title: internal
  contents:
  - get-started
  - MSCC
  - CFM_shiny
  - RDKit-dev

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/get-started.html
